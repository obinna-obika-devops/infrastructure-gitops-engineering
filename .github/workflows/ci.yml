name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Render and validate GitOps overlay
        run: |
          kubectl kustomize gitops/overlays/dev > /tmp/platform-dev.yaml
          test -s /tmp/platform-dev.yaml
          grep -q '^apiVersion:' /tmp/platform-dev.yaml
          grep -q '^kind:' /tmp/platform-dev.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automation tests
        run: python -m pytest -q
