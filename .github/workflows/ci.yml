name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.5

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Render GitOps overlay
        run: |
          kubectl kustomize gitops/overlays/dev > /tmp/platform-dev.yaml
          test -s /tmp/platform-dev.yaml
          grep -q '^apiVersion:' /tmp/platform-dev.yaml
          grep -q '^kind:' /tmp/platform-dev.yaml

      - name: Install Conftest
        run: |
          curl -sSL -o /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.62.0/conftest_0.62.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo install /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Enforce workload policies
        run: conftest test /tmp/platform-dev.yaml --policy policies

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automation tests
        run: python -m pytest -q

      - name: Validate sample drift report
        run: python automation/drift_report.py examples/drift.json --json

      - name: Validate rollback plan
        run: python automation/rollback.py examples/promotion.json
